name: portfolio

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ${DOCKER_APP_CONTAINER_NAME:-portfolio-app}
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - app-storage:/var/www/html/storage
        environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
        depends_on:
            db:
                condition: service_healthy
        networks:
            application:
                aliases:
                    - portfolio-fpm
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 5s
            timeout: 5s
            start_period: 120s
            retries: 20

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        container_name: ${DOCKER_WEBSERVER_CONTAINER_NAME:-portfolio-webserver}
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html:ro
            - app-storage:/var/www/html/storage:ro
        depends_on:
            app:
                condition: service_healthy
        networks:
            - application
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
            interval: 5s
            timeout: 5s
            retries: 20

    db:
        image: mysql:8.4
        container_name: ${DOCKER_DATABASE_CONTAINER_NAME:-portfolio-db}
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
            MYSQL_USER: ${DB_USERNAME:-portfolio}
            MYSQL_PASSWORD: ${DB_PASSWORD:-portfolio}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-portfolio-root}
        ports:
            - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - application
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
            interval: 5s
            timeout: 5s
            start_period: 30s
            retries: 20

    node:
        image: node:24-alpine
        container_name: ${DOCKER_NODE_CONTAINER_NAME:-portfolio-node}
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "127.0.0.1:${VITE_PORT:-5173}:5173"
        command: sh -c "npm ci && npm run dev"
        networks:
            - application
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/@vite/client"]
            interval: 5s
            timeout: 5s
            start_period: 60s
            retries: 20

    redis:
        image: redis:7-alpine
        container_name: ${DOCKER_REDIS_CONTAINER_NAME:-portfolio-redis}
        profiles: [tools]
        volumes:
            - redis_data:/data
        networks:
            - application
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:5-apache
        container_name: ${DOCKER_PHPMYADMIN_CONTAINER_NAME:-portfolio-phpmyadmin}
        profiles: [tools]
        ports:
            - "127.0.0.1:${PHPMYADMIN_PORT:-7002}:80"
        environment:
            PMA_HOST: db
        depends_on:
            db:
                condition: service_healthy
        networks:
            - application

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: ${DOCKER_MAILHOG_CONTAINER_NAME:-portfolio-mailhog}
        profiles: [tools]
        ports:
            - "127.0.0.1:${MAILHOG_PORT:-8025}:8025"
        networks:
            - application

volumes:
    # Reuse the database and storage created by the previous portfolio layout.
    mysql_data:
        name: portfolio_mysql-data
    app-storage:
        name: portfolio_backend-storage
    vendor:
    node_modules:
    redis_data:

networks:
    application:
        name: ${DOCKER_NETWORK_INTERNAL_NAME:-portfolio}
        driver: bridge
